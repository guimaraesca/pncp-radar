# Configuração de temas e palavras-chave para filtragem no PNCP
# Foco Exclusivo: Perfil Carlos Artur Guimarães & Felipe Souza
# Dados, Políticas Públicas, Governança, Gestão de Projetos e Educação

categories:
  # -------------------------------------------------------------
  # VERTICAL 1: DADOS & POLÍTICAS PÚBLICAS
  # -------------------------------------------------------------
  dados_politicas_publicas:
    name: "Dados, IA & Políticas Públicas"
    subtemas:
      analise_dados:
        name: "Análise de Dados & BI"
        terms:
          - "analise de dados"
          - "ciencia de dados"
          - "business intelligence"
          - "dashboard"
          - "painel interativo"
          - "power bi"
          - "tableau"
          - "google looker"
          - "plotly"
          - "big data"
          - "engenharia de dados"
          - "pipeline de dados"
          - "etl"
          - "elt"
          - "python"
          - "linguagem r"
          - "bigquery"
          - "redshift"
          - "dados educacionais"
          - "governanca de dados"
      
      monitoramento_avaliacao:
        name: "Monitoramento & Avaliação (M&A)"
        terms:
          - "monitoramento e avaliacao"
          - "avaliacao de impacto"
          - "indicadores de desempenho"
          - "kpis"
          - "gestao baseada em evidencias"
          - "sala de situacao"
          - "avaliacao de politicas publicas"

  # -------------------------------------------------------------
  # VERTICAL 2: GOVERNANÇA & GESTÃO DE PROJETOS
  # -------------------------------------------------------------
  governanca_projetos:
    name: "Governança & Gestão de Projetos Estratégicos"
    subtemas:
      gestao_projetos:
        name: "Gestão de Projetos"
        terms:
          - "gestao de projetos"
          - "pmbok"
          - "metodologias ageis"
          - "scrum"
          - "escritorio de projetos"
          - "pmo"
          - "projetos estrategicos"
          - "mapeamento de processos"
          - "fluxos institucionais"
      
      consultoria_governanca:
        name: "Consultoria & Governança"
        terms:
          - "governanca"
          - "consultoria especializada"
          - "assessoria tecnica"
          - "diagnostico institucional"
          - "notas tecnicas"
          - "relatorios executivos"
          - "transformacao digital"

  # -------------------------------------------------------------
  # VERTICAL 3: EDUCAÇÃO DIGITAL E STEAM
  # -------------------------------------------------------------
  educacao_digital:
    name: "Políticas Educacionais & STEAM"
    subtemas:
      tecnologia_educacional:
        name: "Tecnologia & Inovação Educacional"
        terms:
          - "tecnologia educacional"
