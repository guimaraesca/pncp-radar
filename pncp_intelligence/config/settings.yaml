# Configurações do Pipeline PNCP Intelligence
api:
  consulta_base_url: "https://pncp.gov.br/api/consulta/v1"
  pncp_base_url: "https://pncp.gov.br/api/pncp/v1"
  user_agent: "Mozilla/5.0 (compatible; PNCP-Market-Intelligence/1.0; +https://github.com)"
  timeout_seconds: 25
  max_retries: 4
  backoff_factor: 1.5
  rate_limit_delay_seconds: 0.3

collector:
  # Janela de tempo: 2 anos
  years_back: 2
  # Tamanho do bloco de datas por requisição (em dias):
  chunk_days: 15
  # Tamanho máximo da página no PNCP (máx oficial = 50)
  page_size: 50
  # Modalidades monitoradas:
  # 6: Pregão Eletrônico
  # 4: Concorrência Eletrônica
  # 8: Dispensa de Licitação
  # 12: Credenciamento
  modalidades:
    - 6
    - 4
    - 8
    - 12
  # Buscar itens detalhados apenas para editais com match de palavras-chave
  fetch_items_on_match: true

storage:
  sqlite_path: "pncp_intelligence/data/pncp_intelligence.sqlite"
  raw_cache_dir: "pncp_intelligence/data/raw"
  processed_dir: "pncp_intelligence/data/processed"
