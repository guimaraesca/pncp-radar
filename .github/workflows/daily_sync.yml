name: Sincronização Diária PNCP & Alerta Telegram

on:
  schedule:
    # Executa todos os dias às 07:00 BRT (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique na aba Actions do GitHub

jobs:
  sync-pncp:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executar Rotina Diária de Coleta & Disparo Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daily_sync.py

      - name: 🔄 Commit e Push do Banco de Dados Atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pncp_intelligence/data/pncp_intelligence.sqlite pncp_intelligence/data/processed/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualização automática do pipeline PNCP [skip ci]" && git push)
