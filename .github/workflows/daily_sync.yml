name: Sincronização Diária I.C.A.R.O. & Alerta Telegram

on:
  schedule:
    # Executa todos os dias às 08:00 BRT (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite disparo manual com 1 clique na aba Actions do GitHub

jobs:
  sync-icaro:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Permissão para commitar o banco e artefatos atualizados

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium || true

      - name: 🚀 Executar Rotina I.C.A.R.O. & Disparo no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_daily_sync.py

      - name: 🩺 Resumo de Observabilidade de Dados
        if: always()
        run: |
          python -m pncp_intelligence.src.observability --markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: 🔄 Commit e Push dos Dados Atualizados
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pncp_intelligence/data/ docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualização automática do pipeline I.C.A.R.O. [skip ci]" && git push)
